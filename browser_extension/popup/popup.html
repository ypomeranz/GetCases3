<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GetCases</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <h1>GetCases</h1>
  </header>

  <p id="status" class="status" role="status">Looking for GetCases…</p>

  <p id="count" class="count" hidden></p>
  <button id="pdf" type="button" class="primary" hidden>Show this PDF with citation links</button>
  <button id="rescan" type="button" hidden>Read this page again</button>

  <section class="options">
    <label><input type="checkbox" id="enabled"> Link citations on web pages</label>
    <label id="siteRow" hidden><input type="checkbox" id="site"> …on <span id="host"></span></label>
    <label><input type="checkbox" id="pdfViewer"> Open PDFs with citation links</label>
    <label><input type="checkbox" id="interceptLinks"> Open pages' own links to cases and statutes in GetCases while it runs</label>
  </section>

  <details>
    <summary>Connection</summary>
    <label class="port">GetCases port
      <input type="number" id="port" min="1024" max="65535" step="1">
    </label>
    <p class="hint">Must match <code>browser_bridge_port</code> in GetCases's config.json; 21983 unless you changed it.</p>
  </details>

  <p class="hint" id="help">With GetCases running, clicking a citation opens it in the app; without it, on the web page the app would open.</p>

  <script src="popup.js"></script>
</body>
</html>
